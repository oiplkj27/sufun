<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font order: Selawik for English, Noto Sans CJK KR for Korean
     (so Hangul and Hanja use the Korean glyph style, not the Japanese/Chinese one). -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Selawik</family>
      <family>Noto Sans CJK KR</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- Fonts used in HWP/HWPX documents (Hancom Office) and old Windows Korean
       documents. They are not free, so show them with the free Noto CJK KR fonts.
       Serif-style (명조/바탕 = with strokes) -> Noto Serif CJK KR,
       sans-style (고딕/돋움 = plain)       -> Noto Sans CJK KR. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>함초롬바탕</string><string>HCR Batang</string>
      <string>한컴바탕</string><string>HY신명조</string><string>HYSinMyeongJo-Medium</string>
      <string>신명조</string><string>휴먼명조</string><string>바탕</string><string>Batang</string>
      <string>바탕체</string><string>BatangChe</string><string>궁서</string><string>Gungsuh</string>
      <string>나눔명조</string><string>NanumMyeongjo</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>함초롬돋움</string><string>HCR Dotum</string>
      <string>한컴돋움</string><string>HY견고딕</string><string>HY중고딕</string><string>HY헤드라인M</string>
      <string>휴먼고딕</string><string>돋움</string><string>Dotum</string><string>돋움체</string><string>DotumChe</string>
      <string>굴림</string><string>Gulim</string><string>굴림체</string><string>GulimChe</string>
      <string>맑은 고딕</string><string>Malgun Gothic</string>
      <string>나눔고딕</string><string>NanumGothic</string>
    </test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
</fontconfig>
