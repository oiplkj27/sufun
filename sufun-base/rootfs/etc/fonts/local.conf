<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font order: Selawik for English, Noto Sans CJK KR for Korean
     (so Hangul and Hanja use the Korean glyph style, not the Japanese/Chinese one). -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Selawik</family>
      <family>Noto Sans CJK KR</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- Fonts used in HWP/HWPX documents (Hancom Office) and old Windows Korean
       documents. They are not free, so show them with the free Noto CJK KR fonts.
       Serif-style (명조/바탕 = with strokes) -> Noto Serif CJK KR,
       sans-style (고딕/돋움 = plain)       -> Noto Sans CJK KR.
       One <alias> per font name ("accept" = used only when the real font is
       not installed). -->
  <alias binding="same"><family>함초롬바탕</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>HCR Batang</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>한컴바탕</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>HY신명조</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>HYSinMyeongJo-Medium</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>신명조</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>휴먼명조</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>바탕</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>Batang</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>바탕체</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>BatangChe</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>궁서</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>Gungsuh</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>나눔명조</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>NanumMyeongjo</family><accept><family>Noto Serif CJK KR</family></accept></alias>
  <alias binding="same"><family>함초롬돋움</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>HCR Dotum</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>한컴돋움</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>HY견고딕</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>HY중고딕</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>HY헤드라인M</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>휴먼고딕</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>돋움</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Dotum</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>돋움체</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>DotumChe</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>굴림</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Gulim</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>굴림체</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>GulimChe</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>맑은 고딕</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Malgun Gothic</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>나눔고딕</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>NanumGothic</family><accept><family>Noto Sans CJK KR</family></accept></alias>
</fontconfig>
