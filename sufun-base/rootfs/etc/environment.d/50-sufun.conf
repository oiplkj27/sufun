# Session environment for every user (read by the systemd user manager, which
# starts the Plasma session). Replaces the old /etc/environment edit, because
# /etc/environment belongs to the "pam" package.

# Fcitx5 for X11 (XWayland) apps; native Wayland apps use the KWin input method.
XMODIFIERS=@im=fcitx
# Steam: the close button really closes the window (instead of minimizing it).
# sufun-steam then quits Steam completely (see /usr/lib/sufun/steam-launch).
STEAM_FRAME_FORCE_CLOSE=1
