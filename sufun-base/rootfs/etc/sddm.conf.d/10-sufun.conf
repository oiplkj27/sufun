# SUFUN login screen: Breeze theme, running on Wayland (no Xorg = less RAM),
# with Plasma's on-screen keyboard for tablet use.
#
# Why /etc and not /usr/lib/sddm/sddm.conf.d: Arch's sddm package ships
# /usr/lib/sddm/sddm.conf.d/default.conf, which lists EVERY setting with its
# default value (theme "", display server x11). Files there are read in name
# order, so default.conf (d) was read after our old 50-sufun.conf (5) and undid
# it: SDDM showed its built-in fallback screen on X11. /etc/sddm.conf.d is read
# after /usr/lib, so these settings win. System Settings > Login Screen writes
# /etc/sddm.conf.d/kde_settings.conf, which comes after this file, so your own
# choices there still win over these defaults.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
# Empty: on Wayland the on-screen keyboard comes from KWin (see --inputmethod
# below). Qt's own "qtvirtualkeyboard" would pop up a second keyboard.
InputMethod=

[Wayland]
# --inputmethod: KWin starts Plasma's on-screen keyboard (plasma-keyboard) for the
# login screen; Breeze's keyboard button (bottom left) shows and hides it.
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --inputmethod plasma-keyboard

[Theme]
# Breeze (from plasma-desktop): user picture and password field in the middle,
# big clock with the date above it, keyboard and power buttons at the bottom.
# The session and keyboard-layout buttons only appear when there is more than
# one session or layout.
Current=breeze
