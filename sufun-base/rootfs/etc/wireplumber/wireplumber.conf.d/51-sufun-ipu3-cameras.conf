# SUFUN, Surface Go 3 cameras: hide the raw IPU3 video nodes (ipu3-cio2 = raw
# sensor data, ipu3-imgu = the image processor's internal pipes). Apps can't use
# them directly, but browsers (Firefox) listed and picked them, and the camera
# then "could not start". The real cameras stay available through libcamera
# (front OV5693, rear OV8865). USB webcams are not affected.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "ipu3-cio2" }
      { api.v4l2.cap.driver = "ipu3-imgu" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
