# SUFUN initramfs (installed system). Arch's default systemd-based list, plus
# "plymouth" right after "systemd" (the Arch wiki: systemd must come before plymouth).
# Named "10-..." so that on the live USB archiso's own "archiso.conf" (read later) wins.
HOOKS=(base systemd plymouth autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
