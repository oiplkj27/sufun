# Thrashing protection (MGLRU, built into the linux-surface kernel:
# CONFIG_LRU_GEN=y, CONFIG_LRU_GEN_ENABLED=y).
# Pages used in the last 1000 ms are never evicted. When memory is really full
# the kernel then asks the OOM killer (earlyoom acts even earlier) instead of
# freezing the desktop by swapping the same pages in and out.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
