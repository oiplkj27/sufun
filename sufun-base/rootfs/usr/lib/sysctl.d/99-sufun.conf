# Tuned for a large zram swap on a 4 GB device. (Still correct with zram = 1.5 x RAM.)
# Swap to zram eagerly: it's fast RAM compression, not a slow disk (max is 200).
vm.swappiness = 180
# zram has no seek time, so read pages one at a time instead of in clusters.
vm.page-cluster = 0
# Avoid sudden bursts of memory reclaim that cause stutter.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Flush writes in smaller chunks so the slow eMMC doesn't stall the desktop.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
