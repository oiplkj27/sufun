# Closing the Type Cover over the screen = sleep, also on the charger.
# With an external monitor ("docked") nothing happens.
# Note: while Plasma is running, its power settings (powerdevilrc) decide; these
# values apply at the login screen and when nobody is logged in.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
