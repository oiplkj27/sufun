# Smoother hand-over from the SUFUN boot screen to the login screen:
# Plymouth quits but leaves its last picture on the screen ("retain splash"),
# so there is no black text console between the boot screen and SDDM.
# (Same idea as GDM's service file.)
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service plymouth-start.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
