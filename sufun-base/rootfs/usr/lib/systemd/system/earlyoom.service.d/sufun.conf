# earlyoom: closes ONE misbehaving program before memory runs out and the desktop freezes.
# It acts when BOTH are true: less than 8% RAM free, and less than 60% of zram swap free
# (earlier than before; memory STALLS are handled by sufun-memguard, see there).
#   --prefer: kill these first -> Firefox tab processes and Steam's built-in browser
#             (steamwebhelper). Windows programs (".exe") are NOT preferred: Proton games
#             run as "<game>.exe", and the game must survive longer than steamwebhelper.
#   --avoid:  never kill the desktop itself (KWin, Plasma, login, sound, network)
#   -n:       show a notification saying what was closed (via systembus-notify)
# Note: in systemd files "$$" means a literal "$" (end of the name).
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 8 -s 60 -r 3600 -n --prefer "^(Isolated Web Co|Web Content|file:// Content|steamwebhelper)$$" --avoid "^(kwin_wayland|plasmashell|Xwayland|sddm|sddm-helper|systemd|systemd-logind|dbus-broker|dbus-daemon|pipewire|pipewire-pulse|wireplumber|NetworkManager|kded6|ksmserver)$$"
