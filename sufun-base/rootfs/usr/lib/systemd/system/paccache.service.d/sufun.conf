# Weekly cleanup of /var/cache/pacman/pkg (run by paccache.timer):
#   -rk1  keep only 1 version of each installed package (the newest), delete older ones
#   -ruk0 delete cached files of packages that are no longer installed
# Want one older version kept for downgrades? Change -rk1 to -rk2.
[Service]
ExecStart=
ExecStart=/usr/bin/paccache -rk1
ExecStart=/usr/bin/paccache -ruk0
