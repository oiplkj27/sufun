# No hibernation (최대 절전 모드) on SUFUN: swap is zram (compressed RAM), and
# RAM is lost when the power goes off, so there is nowhere to save a hibernation
# image. Saying "no" here makes logind report CanHibernate=na, so the login
# screen and Plasma's power menu hide the button instead of showing it greyed out.
# Normal sleep (절전, also on lid close) is NOT touched and keeps working.
[Sleep]
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
