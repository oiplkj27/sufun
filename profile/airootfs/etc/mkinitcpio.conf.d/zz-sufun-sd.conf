# Live system (archiso) only: everything needed to start SUFUN from a microSD card.
# Read after archiso.conf ("zz-"), and only ADDS modules (archiso's hooks stay).
#   rtsx_pci, rtsx_pci_sdmmc  the Surface Go 3's microSD reader: Realtek RTS522A,
#                             PCI ID 10ec:522a (rtsx_pci is in drivers/misc, not
#                             drivers/mmc, so it is listed by name)
#   sdhci, sdhci_pci          Intel SD/eMMC controller (also the CI test's virtual SD card)
#   mmc_core, mmc_block       SD/MMC cards as block devices (/dev/mmcblk*)
#   vfat, exfat + nls         the card's file system (FAT32 or exFAT)
# build.sh checks that all of them really end up in the live initramfs.
MODULES+=(mmc_core mmc_block sdhci sdhci_pci rtsx_pci rtsx_pci_sdmmc vfat exfat nls_cp437 nls_iso8859_1 nls_utf8)

# SUFUN boot screen (Plymouth) in the live system too: "kms" (the graphics driver,
# not in archiso's list) and "plymouth" right after "modconf", before archiso's
# hooks look for the live medium. The logo only shows with the kernel options
# "quiet splash" (normal boot menu entry); the "text mode" entry has no "splash",
# so you see the messages there. Esc switches between logo and text at any time.
# build.sh checks that the SUFUN theme really is in the live initramfs.
_sufun_hooks=()
_sufun_done=0
for _h in "${HOOKS[@]}"; do
  [[ $_h == kms || $_h == plymouth ]] && continue
  _sufun_hooks+=("$_h")
  if [[ $_h == modconf ]]; then _sufun_hooks+=(kms plymouth); _sufun_done=1; fi
done
if (( ! _sufun_done )); then        # no "modconf": after "udev" instead
  _sufun_hooks=()
  for _h in "${HOOKS[@]}"; do
    [[ $_h == kms || $_h == plymouth ]] && continue
    _sufun_hooks+=("$_h")
    [[ $_h == udev ]] && _sufun_hooks+=(kms plymouth)
  done
fi
HOOKS=("${_sufun_hooks[@]}")
unset _sufun_hooks _sufun_done _h
