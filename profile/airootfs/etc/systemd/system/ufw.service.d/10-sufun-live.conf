# Live system only: firewall ON like an installed system (block incoming, allow
# outgoing). The live user has no password, so nothing from the network may
# reach this machine (security audit N-1). Installed systems get the same
# setting from the installer.
[Service]
ExecStartPre=/usr/bin/sed -i 's/^ENABLED=.*/ENABLED=yes/' /etc/ufw/ufw.conf
